# Serves the built web app and proxies the API on the same origin, so the browser never needs CORS
# and never learns the API's address. Same shape as CloudFront + S3 + an /api/* behaviour on AWS.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    # The API trusts exactly one proxy hop (TRUST_PROXY_HOPS=1) and reads the client IP from here,
    # so the enquiry rate limit applies per customer rather than to nginx.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://api:3000;
  }

  # Vite puts a content hash in every asset name, so these can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Client-side routes (/category/x, /product/1, /search) all load index.html; never cache it,
  # so a new release is picked up straight away.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri /index.html;
  }
}
